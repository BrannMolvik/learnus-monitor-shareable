name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: node scripts/check-distribution.mjs
      - run: npm test
      - run: python -m unittest discover -s test -p "*_test.py"
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in Get-ChildItem -Filter *.ps1) {
            $tokens = $null; $issues = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$tokens,[ref]$issues) | Out-Null
            if ($issues.Count) { throw "$($script.Name) failed Windows PowerShell parsing" }
          }
